name: arm_tooling
description: Reusable client-side automated remote monitoring for Flutter web and mobile apps.
version: 0.1.0
publish_to: 'none'
homepage: https://github.com/ObsidianXVI/ARM-Tooling
repository: https://github.com/ObsidianXVI/ARM-Tooling
issue_tracker: https://github.com/ObsidianXVI/ARM-Tooling/issues
topics:
  - monitoring
  - telemetry
  - crash-reporting

environment:
  sdk: ^3.10.4

dependencies:
  arm_tooling_core:
    path: ../tooling_core
  flutter:
    sdk: flutter
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The real ingest handler, so a test sends what the SDK sends to what the
  # ingest actually parses.
  citadel_arm_service:
    path: ../citadel_arm_service
  shelf: ^1.4.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
