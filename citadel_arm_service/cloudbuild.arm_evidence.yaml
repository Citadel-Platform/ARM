# Submitted from `citadel_core/arm` so the build context carries both the
# service and `tooling_core`, which it now depends on by path.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --pull
      - --tag
      - ${_IMAGE}
      - --file
      - citadel_arm_service/Dockerfile
      - .

images:
  - ${_IMAGE}

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
