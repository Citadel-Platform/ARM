name: citadel_arm_service
description: Private ARM evidence query and command service contracts and HTTP handler.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  freezed_annotation: ^3.1.0
  googleapis: ^16.0.0
  googleapis_auth: ^2.3.2
  http: ^1.6.0
  shelf: ^1.4.2

dev_dependencies:
  # Test-only, and deliberately: the SDK writes ticket documents that this
  # service reads back, and nothing else holds the two shapes together.
  arm_tooling_core:
    path: ../tooling_core
  build_runner: ^2.7.1
  freezed: ^3.2.3
  lints: ^6.0.0
  test: ^1.25.6
